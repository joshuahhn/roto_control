<!doctype html>
<!-- THROWAWAY UI prototype: compact vertical inspector with inline editing.
     Selected direction: Compact vertical buttons: Right drawer, Below accordion, or Popup editor.
     Learn is a visual demo state with a global color change and alert.
     Open directly, or run:
       python3 -m http.server 8765 --directory src/touchdesigner
       http://localhost:8765/inspector.prototype.html?mode=compact
     ?editor=below (default), ?editor=right, or ?editor=popup compares styles. All fixtures and edits live in memory.
     No TD/MIDI connection. Do not promote prototype code into production. -->
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROTO Inspector · Compact editor styles</title>
<style>
:root{color-scheme:dark;--bg:#141719;--panel:#1c2125;--raised:#252b30;--line:#343d44;--text:#e5e9eb;--dim:#96a3ad;--amber:#efbf73;--cyan:#7ed5db;--red:#ef9292;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit;color:inherit;background:var(--raised);border:1px solid var(--line);border-radius:4px}button{cursor:pointer;padding:5px 8px}button:hover{background:#313940}button.active{color:var(--amber);border-color:#8e7149;background:#3a3125}input,select{padding:5px 6px;min-width:0}button:focus-visible,input:focus,select:focus{border-color:var(--amber);outline:1px solid var(--amber)}input:disabled,select:disabled,button:disabled{opacity:.45}input[type=checkbox]{accent-color:var(--amber)}input[type=number]{appearance:textfield;-moz-appearance:textfield}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}h1,p{margin:0}h1{font-size:13px;font-weight:600}
.workspace{position:relative;max-width:660px}.app{max-width:340px}.header{padding:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}.modes{display:flex;align-items:center;gap:4px;font-size:10px}.routing{padding:6px 8px;background:#1c282b;color:var(--cyan);border-block:1px solid #35464a;display:flex;align-items:center;gap:7px;font-size:10px;white-space:nowrap}.routing button{margin-left:auto;padding:3px 6px;font-size:9px;white-space:nowrap}.content{padding:8px 8px 0}.selectors{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:5px}.selectors label{display:flex;flex-direction:column;gap:4px;font-size:9px;color:var(--dim);letter-spacing:.7px}.selectors select{font-size:10px;color:var(--text);padding:5px 6px;width:100%}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0;font-size:9px;color:var(--dim)}.follow{display:flex;align-items:center;gap:4px}.badge{font-size:9px;color:var(--cyan);border:1px solid #426064;padding:2px 5px;border-radius:10px}.badge.saved{color:var(--amber);border-color:#725b36}
.mini-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}.mini-grid.all-slots{max-height:340px;overflow-y:auto}.mini-tile{display:grid;grid-template-columns:30px minmax(0,1fr) 110px;gap:6px;align-items:center;min-height:34px;padding:5px 7px;width:100%;text-align:left;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:5px}.mini-tile:hover{background:#242b2f}.mini-tile.selected{background:#3a3125;border-color:var(--amber)}.mini-tile.unassigned{border-style:dashed}.mini-slot-head{display:flex;align-items:center;gap:4px;font:10px ui-monospace,monospace;color:var(--dim)}.mini-dot{width:4px;height:4px;border-radius:50%;background:var(--cyan)}.mini-dot.saved{background:#6d7b85}.mini-dot.relearn{background:var(--amber)}.mini-dot.invalid{background:var(--red)}.mini-parameter{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-reading{font:10px ui-monospace,monospace;color:var(--amber);display:flex;justify-content:flex-end;gap:7px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.edit-arrow{color:#9b835e;font-size:15px}.mini-key{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:7px;font-size:8px;color:var(--dim)}.mini-key button{font-size:9px;background:transparent;border:0;color:var(--cyan);padding:0}.hint{margin:5px 0 7px;color:var(--dim);font-size:9px;line-height:1.5}.message{font-size:10px;color:var(--amber);line-height:1.5;padding:5px 0}.message:empty{display:none}.no-results{padding:16px;color:var(--dim);text-align:center;font-size:10px}
.footer{margin:6px 8px 0;padding:6px 0;border-top:1px solid var(--line);font-size:9px;color:var(--dim)}.footer summary{cursor:pointer;line-height:1.6}.footer p{line-height:1.6;margin:7px 0}.footer pre{max-height:220px;overflow:auto;border:1px solid var(--line);padding:8px;background:#101417;font:9px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.scenario-buttons{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.scenario-buttons button{font-size:9px}
.editor-window{position:absolute;left:352px;top:12px;width:294px;padding:12px;background:#20262b;border:1px solid #796347;border-radius:7px;box-shadow:0 8px 30px #0008;z-index:4}.editor-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:9px}.editor-head h2{font-size:15px;margin:4px 0 0;font-weight:600}.editor-kicker{font-size:9px;color:var(--amber);letter-spacing:1px}.editor-close{font-size:18px;background:transparent;border:0;color:var(--dim);padding:0 4px}.editor-context{font-size:10px;line-height:1.5;margin-bottom:10px;overflow-wrap:anywhere}.editor-context span{font:9px ui-monospace,monospace;color:var(--dim)}.editor-field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;color:var(--dim);font-size:10px}.editor-field input,.editor-field select{width:100%;font-size:11px;height:28px;color:var(--text)}.editor-field .target-path{display:none}.editor-field .mode{font-size:11px;color:var(--text);margin-bottom:0}.editor-field .range{display:flex;gap:4px;align-items:center}.editor-field .range input{width:calc(50% - 6px)}.editor-field .value-static{padding:5px;font-size:11px}.editor-error{color:var(--red);font-size:10px;line-height:1.5;margin-bottom:7px}.editor-error:empty{display:none}.editor-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:11px}.editor-actions button{font-size:10px;padding:6px 8px}.editor-apply{background:var(--amber);color:#211b12;border-color:var(--amber)}.editor-apply:hover{background:#f8d39a}.editor-delete{color:var(--red);margin-left:auto}.editor-note{margin-top:9px;font-size:9px;line-height:1.6;color:var(--dim)}#editor-dirty{color:var(--amber)}
.mini-row.open:has(.folded)>.mini-tile{border-bottom-left-radius:0;border-bottom-right-radius:0}.editor-window.folded{position:static;width:100%;padding:8px;border-top:0;border-color:var(--amber);border-radius:0 0 5px 5px;box-shadow:none}.folded .editor-head{padding-bottom:4px;margin-bottom:7px;border:0}.folded .editor-head h2,.folded .editor-context{display:none}.folded .editor-kicker{font-size:8px}.folded .editor-close{font-size:14px}.folded .editor-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.folded .parameter-field,.folded .mode-field{grid-column:1/-1}.folded .editor-field{font-size:9px;gap:3px;margin-bottom:6px}.folded .editor-field input,.folded .editor-field select{height:25px;font-size:10px}.folded .mode-field{display:block}.folded .mode-field .mode{margin-left:7px;font-size:10px}.folded .mode-field select{display:inline-block;width:100px;margin-left:7px}.folded .editor-actions{margin-top:4px}.folded .editor-actions button{padding:5px 7px}.folded .editor-note{font-size:8px;line-height:1.5;margin-top:6px}
@media(max-width:659px){.editor-window:not(.folded){left:12px;top:65px;width:min(294px,calc(100% - 24px));box-shadow:0 10px 40px #000d}}

/* Right is an attached drawer; Popup is an independent floating window. */
.workspace[data-style="right"].with-editor{background:#1b2226}.editor-window.rightward{left:340px;top:0;width:306px;border:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;min-height:410px;background:#1b2226}.modes{gap:3px}.modes button{padding:5px 6px;font-size:9px}.header h1{font-size:12px}.learn-toggle{font-size:9px;padding:3px 6px}.learn-alert{margin:0 8px 7px;padding:8px;background:#684316;border:1px solid #b57b37;border-radius:4px;display:flex;align-items:center;justify-content:space-between;gap:7px;color:#ffdf9e}.learn-alert strong{font-size:10px;letter-spacing:.6px}.learn-alert p{font-size:10px;margin-top:3px}.learn-alert button{background:#f2c577;color:#2c200c;border-color:#f2c577;font-size:9px;padding:4px 6px;white-space:nowrap}.workspace.learn-mode{--panel:#342b1d;--raised:#403220;--line:#715632;--cyan:#efbf73;background:#241f18}.learn-mode .header,.learn-mode .content,.learn-mode .footer{background:#241f18}.learn-mode .routing{background:#3c2d1d;border-color:#785a31}.learn-mode .mini-tile.selected{background:#5b4122;border-color:#efbf73}.learn-mode .editor-window,.learn-mode .editor-window.rightward{background:#30271c;border-color:#ba8744}.learn-mode .mini-dot{background:var(--amber)}.learn-mode .learn-toggle{background:#efbf73;color:#2a1e0c;border-color:#efbf73}.learn-mode .badge{border-color:#ad8248}.learn-mode[data-style="right"].with-editor{background:#30271c}
@media(max-width:659px){.editor-window.rightward{position:static;width:340px;max-width:100%;min-height:0;border-left:0;border-top:1px solid var(--line);margin-top:8px;box-shadow:none}}
@media(max-width:659px){.learn-mode .editor-window:not(.folded):not(.rightward){top:128px}}
</style>
</head>
<body>
<div id="workspace" class="workspace"><main id="app" class="app"></main></div>
<script>
const makeTarget=(slot,parameter,label,value,min=0,max=1,extra={})=>({kind:'knob',slot,parameter,label,value,min,max,mode:'Continuous',hardware:'—',status:'saved',...extra});
const fixtures=[
 {id:'layout-t',name:'T',tracks:[
  {id:'track-t',name:'T',devices:[
   {id:'pixel',name:'pixelSortV3',comp:'/project1/pixelSortV3',targets:[makeTarget(1,'Sortcrit','Sort criterion',0,0,3,{mode:'Menu',options:['Luminance','Red','Green','Blue']}),makeTarget(2,'Lowthresh','Low threshold',.454312),makeTarget(3,'Highthresh','High threshold',.85),makeTarget(4,'Mix','Mix',1),makeTarget(1,'Masksource','Mask Image',0,0,1,{kind:'button',mode:'Cycle',hardware:'TOGGLE',options:['Source (Input 1)','Control (Input 2)']})]},
   {id:'fractal',name:'fractal_pop',comp:'/project1/fractal_pop',targets:[makeTarget(1,'Power','Power',8.164683,1,16)]}
  ]},
  {id:'track-legacy',name:'TRACK',devices:[{id:'legacy',name:'PLUGIN',comp:'',targets:[]}]}
 ]},
 {id:'layout-show',name:'Performance',tracks:[
  {id:'track-visuals',name:'VISUALS',devices:[
   {id:'pixel-show',name:'pixelSortV3',comp:'/project1/pixelSortV3',targets:[makeTarget(1,'Mix','Mix',.65),makeTarget(2,'Lowthresh','Low threshold',.454312),makeTarget(1,'Bypass','Bypass',0,0,1,{kind:'button',mode:'Toggle',hardware:'TOGGLE'})]},
   {id:'fractal-show',name:'fractal_pop',comp:'/project1/fractal_pop',targets:[makeTarget(1,'Power','Power',8.164683,1,16),makeTarget(2,'Scale','Scale',1.2,0,4,{status:'relearn'})]}
  ]},
  {id:'track-lights',name:'LIGHTS',devices:[{id:'bloom',name:'bloom_fx',comp:'/project1/bloom_fx',targets:[makeTarget(1,'Intensity','Intensity',.7),makeTarget(2,'Radius','Radius',.3),makeTarget(1,'Reset','Reset',0,0,1,{kind:'button',mode:'Pulse',hardware:'PUSH',status:'invalid',error:'Destination COMP missing'})]}]}
 ]}
];

fixtures[0].tracks[0].devices.forEach(d=>d.targets.forEach(t=>t.learned=true));
const originalFixtures=JSON.stringify(fixtures);
const initial={layout:'layout-t',track:'track-t',device:'pixel'};
const readPresentation=()=>{const p=new URLSearchParams(location.search).get('editor');return ['right','below','popup'].includes(p)?p:'below'};
const state={presentation:readPresentation(),inspect:{...initial},routing:{...initial},follow:true,view:'assigned',slot:'knob:2',pendingClear:null,message:'',locked:false,learn:false,editor:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slotKey=t=>`${t.kind}:${t.slot}`;
const same=(a,b)=>a.layout===b.layout&&a.track===b.track&&a.device===b.device;
function context(c=state.inspect){const layout=fixtures.find(l=>l.id===c.layout);const track=layout.tracks.find(t=>t.id===c.track);return {layout,track,device:track.devices.find(d=>d.id===c.device)}}
function path(c){const x=context(c);return `${x.layout.name} / ${x.track.name} / ${x.device.name}`}
function targetFor(key){return context().device.targets.find(t=>slotKey(t)===key)}
function statusOf(t){return t.status==='saved'&&t.learned&&same(state.inspect,state.routing)?'mapped':t.status}
function options(items,current){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===current?'selected':''}>${esc(x.name)}</option>`).join('')}
function contextSelector(type,label,items,current){return `<label>${label}<select aria-label="Inspect ${type}" data-context="${type}">${options(items,current)}</select></label>`}
function button(action,label,attrs=''){return `<button type="button" data-action="${action}" ${attrs}>${label}</button>`}
function field(t,name,attrs=''){return `data-field="${name}" data-key="${slotKey(t)}" aria-label="${t.kind} ${t.slot} ${name}" ${attrs}`}
function allSlots(){return ['knob','button'].flatMap(kind=>Array.from({length:8},(_,i)=>targetFor(`${kind}:${i+1}`)||{kind,slot:i+1,empty:true}))}
function parameterSpecs(kind){const comp=context().device.comp;const names=comp.includes('pixelSort')?['Sortcrit','Lowthresh','Highthresh','Mix','Masksource','Bypass','Reset']:comp.includes('fractal')?['Power','Scale','Bypass','Reset']:['Intensity','Radius','Bypass','Reset'];return names.filter(n=>kind==='button'?['Masksource','Bypass','Reset'].includes(n):!['Masksource','Bypass','Reset'].includes(n))}
function createTarget(kind,slot,parameter){const extra={kind,learned:false};let max=1,value=0;
 if(parameter==='Power'){max=16;value=8;}
 if(parameter==='Scale')value=1;
 if(parameter==='Sortcrit'){max=3;Object.assign(extra,{mode:'Menu',options:['Luminance','Red','Green','Blue']});}
 if(parameter==='Masksource')Object.assign(extra,{mode:'Cycle',hardware:'TOGGLE',options:['Source (Input 1)','Control (Input 2)']});
 if(parameter==='Bypass')Object.assign(extra,{mode:'Toggle',hardware:'TOGGLE'});
 if(parameter==='Reset')Object.assign(extra,{mode:'Pulse',hardware:'PUSH'});
 return makeTarget(slot,parameter,parameter,value,0,max,extra);
}
function parameterCell(t){const names=Array.from(new Set([...(t.empty?[]:[t.parameter]),...parameterSpecs(t.kind)]));return `<select class="cell-editor target-select" ${field(t,'parameter',context().device.comp?'':'disabled')} title="${esc(context().device.comp||'No linked COMP')}">${t.empty?'<option value="">Choose parameter…</option>':''}${names.map(n=>`<option value="${n}" ${n===t.parameter?'selected':''}>${n}</option>`).join('')}</select>${!t.empty?`<span class="target-path" title="${esc(context().device.comp+'.par.'+t.parameter)}">${esc(context().device.comp)}</span>`:''}`}
function valueCell(t){if(t.empty)return '<span class="empty">—</span>';const disabled=t.status==='invalid'?'disabled':'';
 if(t.options)return `<select class="cell-editor" ${field(t,'value',disabled)}>${t.options.map((n,i)=>`<option value="${i}" ${i===t.value?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
 if(t.mode==='Toggle')return `<select class="cell-editor" ${field(t,'value',disabled)}><option value="0" ${t.value===0?'selected':''}>Off</option><option value="1" ${t.value===1?'selected':''}>On</option></select>`;
 if(t.mode==='Pulse')return '<span class="value-static" title="Pulse action is not fired by this prototype">Ready</span>';
 return `<input class="cell-editor" type="number" step="any" value="${t.value}" min="${t.min}" max="${t.max}" ${field(t,'value',disabled)}>`;
}
function rangeCell(t){if(t.empty)return '<span class="empty">—</span>';if(t.kind==='button'||t.options)return `<span class="value-static" title="Fixed bounds for this parameter style">${t.min} — ${t.max}</span>`;return `<div class="range"><input class="cell-editor" type="number" step="any" value="${t.min}" ${field(t,'min',t.status==='invalid'?'disabled':'')}><span class="dash">–</span><input class="cell-editor" type="number" step="any" value="${t.max}" ${field(t,'max',t.status==='invalid'?'disabled':'')}></div>`}
function modeCell(t){if(t.empty)return '<span class="empty">—</span>';return `<span class="mode" title="TD action mode must match the parameter style">${esc(t.mode)}</span>${t.kind==='button'?`<select class="cell-editor" ${field(t,'hardware')} title="Declared input adapter; does not reconfigure hardware"><option ${t.hardware==='TOGGLE'?'selected':''}>TOGGLE</option><option ${t.hardware==='PUSH'?'selected':''}>PUSH</option></select>`:'<span class="value-static">—</span>'}`}
function displayValue(t){return t.options?t.options[t.value]:t.mode==='Toggle'?(t.value?'On':'Off'):t.mode==='Pulse'?'Ready':Number(t.value.toFixed(3)).toString()}
function miniGrid(){const rows=state.view==='slots'?allSlots():context().device.targets;return `<div class="mini-grid ${state.view==='slots'?'all-slots':''}">${rows.map(t=>{const expanded=state.editor?.key===slotKey(t);return `<div class="mini-row ${expanded?'open':''}"><button type="button" class="mini-tile ${slotKey(t)===state.slot?'selected':''} ${t.empty?'unassigned':''}" data-action="open-editor" data-key="${slotKey(t)}" data-row="${slotKey(t)}" aria-label="Edit ${esc(t.kind+' '+t.slot+', '+(t.label||'Unassigned'))}" ${state.presentation==='popup'?'aria-haspopup="dialog"':''} aria-expanded="${expanded}" ${expanded?'aria-controls="slot-editor"':''} title="${esc(t.empty?'Assign this slot':context().device.comp+'.par.'+t.parameter)}"><span class="mini-slot-head"><span>${t.kind==='knob'?'K':'B'}${t.slot}</span><i class="mini-dot ${t.empty?'saved':statusOf(t)}" title="${t.empty?'Unassigned':statusOf(t)}"></i></span><span class="mini-parameter">${t.empty?'Unassigned':esc(t.parameter)}</span><span class="mini-reading">${t.empty?'＋':esc(displayValue(t))}<span class="edit-arrow">${state.presentation==='below'?(expanded?'⌃':'⌄'):'›'}</span></span></button>${expanded&&state.presentation==='below'?editorWindow():''}</div>`}).join('')}</div>${rows.length?'':'<div class="no-results">No mappings</div>'}<div class="mini-key"><span>K = knob · B = button</span>${button(state.view==='slots'?'assigned':'slots',state.view==='slots'?'Assigned only':'Show 16 slots')}<span>${context().device.targets.length}/16 assigned</span></div>`}
function openEditor(key){if(state.editor?.key===key){if(state.presentation==='below')closeEditor();else document.querySelector('.editor-window [data-field]')?.focus();return;}const t=targetFor(key);if(!t)state.view='slots';const [kind,slot]=key.split(':');state.slot=key;state.pendingClear=null;state.editor={key,context:{...state.inspect},draft:t?JSON.parse(JSON.stringify(t)):{kind,slot:Number(slot),empty:true},dirty:false,error:''};state.message='';render();document.querySelector('.editor-window [data-field]')?.focus();}
function closeEditor(){const key=state.editor?.key;state.editor=null;state.pendingClear=null;render();document.querySelector(`button[data-action="open-editor"][data-key="${key}"]`)?.focus();}
function editorWindow(){if(!state.editor)return '';const {draft:t,key,error,dirty}=state.editor;return `<section id="slot-editor" class="editor-window ${state.presentation==='below'?'folded':state.presentation==='right'?'rightward':''}" role="${state.presentation==='popup'?'dialog':'region'}" ${state.presentation==='popup'?'aria-modal="false"':''} aria-labelledby="editor-title"><header class="editor-head"><div><span class="editor-kicker">SLOT EDITOR · ${t.kind==='knob'?'K':'B'}${t.slot}</span><h2 id="editor-title">${esc(t.empty?'Assign parameter':t.parameter)}</h2></div>${button('close-editor','×','class="editor-close" aria-label="Close editor"')}</header><div class="editor-context">${esc(path(state.inspect))}<br><span>${esc(context().device.comp||'No linked COMP')}</span></div><div class="editor-fields"><label class="editor-field parameter-field">Parameter${parameterCell(t)}</label>${t.empty?'':`<label class="editor-field">Value${valueCell(t)}</label><label class="editor-field">Min — Max${rangeCell(t)}</label><label class="editor-field mode-field">TD mode / declared input${modeCell(t)}</label>`}</div><div class="editor-error" role="status">${esc(error)}</div><div class="editor-actions">${button('apply-editor','Apply (demo)',`class="editor-apply" ${t.empty||t.status==='invalid'?'disabled':''}`)}${button('close-editor','Cancel')}${!t.empty?state.pendingClear===key?button('delete-editor','Confirm delete','class="editor-delete"')+button('cancel-editor-delete','Keep'):button('clear-editor','Clear…','class="editor-delete"'):''}</div><p class="editor-note"><span id="editor-dirty">${dirty?'Unsaved changes':'Edit a field, then Apply'}</span> · 切換 slot／context 會放棄未 Apply 修改。</p></section>`}
function updateDraft(el){if(!state.editor)return;const name=el.dataset.field;const draft=state.editor.draft;
 if(name==='parameter'){if(!el.value)return;const original=targetFor(state.editor.key);state.editor.draft=original?.parameter===el.value?JSON.parse(JSON.stringify(original)):createTarget(draft.kind,draft.slot,el.value);state.editor.dirty=true;state.editor.error='';render();return;}
 draft[name]=name==='hardware'?el.value:el.value.trim()===''?NaN:Number(el.value);state.editor.dirty=true;state.editor.error='';const dirty=document.getElementById('editor-dirty');if(dirty)dirty.textContent='Unsaved changes';const err=document.querySelector('.editor-error');if(err)err.textContent='';const json=document.querySelector('.demo-state pre');if(json)json.textContent=JSON.stringify(snapshot(),null,2);
}
function applyEditor(){if(!state.editor)return;const {draft:t,key,context:c}=state.editor;if(!same(c,state.inspect)){closeEditor();return;}const d=context().device;
 if(t.status==='invalid'){state.editor.error='Destination 未可用；先揀有效 parameter。';render();return;}
 if(t.empty||![t.value,t.min,t.max].every(Number.isFinite)||t.min>=t.max||t.value<t.min||t.value>t.max||((t.options||t.mode==='Toggle')&&!Number.isInteger(t.value))){state.editor.error='Value 必須喺有效 Min／Max 範圍內。';render();return;}
 if(d.targets.some(x=>x.parameter===t.parameter&&slotKey(x)!==key)){state.editor.error='呢個 Device 已經有同一個 parameter。';render();return;}
 const original=targetFor(key);const replacement=JSON.parse(JSON.stringify(t));if(original&&original.parameter===t.parameter&&original.learned&&(original.min!==t.min||original.max!==t.max))replacement.status='relearn';if(original)d.targets[d.targets.indexOf(original)]=replacement;else d.targets.push(replacement);state.editor.draft=JSON.parse(JSON.stringify(replacement));state.editor.dirty=false;state.editor.error='';state.pendingClear=null;state.message='Demo mapping 已 Apply；hardware routing 保持原樣。';render();
}
function learnAlert(){return state.learn?`<div class="learn-alert" role="alert"><div><strong><span aria-hidden="true">●</span> LEARN MODE ON</strong><p>你而家開咗 Learn mode</p></div>${button('exit-learn','Exit Learn')}</div>`:''}
function snapshot(){return {...state,inspect_label:path(state.inspect),routing_label:path(state.routing),targets:context().device.targets,source:'Synthetic in-memory data; no TD/MIDI connection'}}
function render(){const open=document.querySelector('.demo-state')?.open;const {layout,track}=context();const live=same(state.inspect,state.routing);document.getElementById('workspace').dataset.style=state.presentation;document.getElementById('workspace').className='workspace '+(state.editor?'with-editor ':'')+(state.learn?'learn-mode':'');document.getElementById('app').className='app';document.getElementById('app').innerHTML=`<header class="header"><h1>Mapping Inspector</h1><div class="modes" aria-label="Editor style">${button('right','Right',`class="${state.presentation==='right'?'active':''}"`)}${button('below','Below',`class="${state.presentation==='below'?'active':''}"`)}${button('popup','Popup',`class="${state.presentation==='popup'?'active':''}"`)}</div></header>${learnAlert()}<div class="routing"><span>${esc(path(state.routing))}</span>${state.locked?'<span style="color:var(--amber)">LOCK</span>':''}${button('active','Back to active')}</div><section class="content"><div class="selectors">${contextSelector('layout','LAYOUT',fixtures,state.inspect.layout)}${contextSelector('track','TRACK',layout.tracks,state.inspect.track)}${contextSelector('device','DEVICE',track.devices,state.inspect.device)}</div><div class="bar"><span class="badge ${live?'':'saved'}">${live?'Active context':'Saved context'}</span>${button('learn',state.learn?'Learning':'Learn',`class="learn-toggle ${state.learn?'active':''}" aria-pressed="${state.learn}"`)}<label class="follow"><input id="follow" type="checkbox" ${state.follow?'checked':''}>Follow active view</label></div>${miniGrid()}<p class="hint">${state.presentation==='below'?'Click 下方展開 · 再 click 同一個 slot 收返。':state.presentation==='right'?'Click 右邊展開 editor。':'Click 一個 slot 開 floating editor。'}</p><div id="message" class="message" role="status">${esc(state.message)}</div></section><footer class="footer"><details class="demo-state"><summary>Demo state · edits 留喺 memory</summary><p>同一個 compact panel，用 Right／Below／Popup 比較 editing 方式。Learn button 只模擬 UI 提示，唔會開啟 hardware LEARN。一次只開一個 editor；切換 style 保留 draft，切換 slot／context 放棄未 Apply 修改。呢個 HTML 唔會連接 TD 或 MIDI。</p><div class="scenario-buttons">${button('lock',state.locked?'Unlock scenario':'LOCK scenario')}${button('hardware','Simulate hardware Device')}${button('reset','Reset demo')}</div><pre>${esc(JSON.stringify(snapshot(),null,2))}</pre></details></footer>${state.presentation!=='below'?editorWindow():''}`;document.getElementById('workspace').dataset.style=state.presentation;document.getElementById('workspace').className='workspace '+(state.editor?'with-editor ':'')+(state.learn?'learn-mode':'');document.getElementById('workspace').style.minHeight=state.editor&&state.presentation!=='below'?(document.querySelector('.editor-window').offsetTop+document.querySelector('.editor-window').offsetHeight+10)+'px':'';if(open)document.querySelector('.demo-state').open=true;}
function browse(type,id){const next={...state.inspect};next[type]=id;if(type==='layout'){const l=fixtures.find(l=>l.id===id);next.track=l.tracks[0].id;next.device=l.tracks[0].devices[0].id;}if(type==='track')next.device=fixtures.find(l=>l.id===next.layout).tracks.find(t=>t.id===id).devices[0].id;state.inspect=next;state.editor=null;state.follow=false;state.pendingClear=null;state.slot='';state.message='';render();}
function handleAction(el){const action=el.dataset.action;
 if(action==='open-editor'){openEditor(el.dataset.key);return;}
 if(action==='close-editor'){closeEditor();return;}
 if(action==='apply-editor'){applyEditor();return;}
 if(action==='clear-editor'){state.pendingClear=state.editor.key;render();return;}
 if(action==='cancel-editor-delete'){state.pendingClear=null;render();return;}
 if(action==='delete-editor'){const key=state.editor.key;if(state.pendingClear!==key)return;context().device.targets=context().device.targets.filter(t=>slotKey(t)!==key);state.editor=null;state.pendingClear=null;state.message='Demo mapping 已刪除。';render();return;}
 if(['right','below','popup'].includes(action)){state.presentation=action;const url=new URL(location.href);url.searchParams.set('editor',action);url.searchParams.delete('mode');url.searchParams.delete('variant');try{history.replaceState(null,'',url)}catch(_){}state.message='';if(!state.editor){openEditor(state.slot||slotKey(context().device.targets[0]||{kind:'knob',slot:1}));return;}}
 else if(action==='learn'){state.learn=!state.learn;state.message='';}
 else if(action==='exit-learn'){state.learn=false;state.message='';}
 else if(action==='assigned'||action==='slots')state.view=action;
 else if(action==='active'){state.inspect={...state.routing};state.editor=null;state.message='';}
 else if(action==='lock'){state.locked=!state.locked;state.message=state.locked?'LOCK scenario：可以繼續 inspect 其他 context。':'';}
 else if(action==='hardware'){const {track}=context(state.routing);const i=track.devices.findIndex(d=>d.id===state.routing.device);state.routing.device=track.devices[(i+1)%track.devices.length].id;if(state.follow){state.inspect={...state.routing};state.editor=null;}state.message='Simulated hardware selection';}
 else if(action==='reset'){fixtures.splice(0,fixtures.length,...JSON.parse(originalFixtures));Object.assign(state,{inspect:{...initial},routing:{...initial},follow:true,view:'assigned',slot:'knob:2',locked:false,learn:false,message:'',editor:null});}
 state.pendingClear=null;render();
}
// Commit only after a native change (blur / Enter), preserving ordinary text entry.
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.field){if(el.closest('.editor-window'))updateDraft(el);}else if(el.dataset.context)browse(el.dataset.context,el.value);else if(el.id==='follow'){state.editor=null;state.follow=el.checked;if(state.follow)state.inspect={...state.routing};state.pendingClear=null;state.message='';render();}});
document.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(button)handleAction(button);});
document.addEventListener('focusin',event=>{const row=event.target.closest('[data-row]');if(!row)return;state.slot=row.dataset.row;document.querySelectorAll('[data-row]').forEach(r=>r.classList.toggle('selected',r===row));});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.editor){event.preventDefault();closeEditor();return;}if(event.target.closest('.editor-window')&&event.key==='Enter'&&event.target.matches('input')){event.preventDefault();updateDraft(event.target);applyEditor();}});
document.addEventListener('input',event=>{if(event.target.closest('.editor-window')&&event.target.dataset.field&&event.target.matches('input'))updateDraft(event.target);});
window.addEventListener('popstate',()=>{state.editor=null;state.presentation=readPresentation();render();});
render();console.info('Compact editor prototype ready',snapshot());
</script>
</body>
</html>
